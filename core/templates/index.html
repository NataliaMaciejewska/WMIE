{% load static %}

<!DOCTYPE html>

<head>
    <title>Uniwersytet Zielonogórski</title>

    <style>
        body, html {
            height: 100%;
            overflow: hidden;
            margin: 0px;
        }

        * {
            box-sizing: border-box;
        }

        .bg-image {
            background-image: url("{{ background_image }}");
            -webkit-filter: blur(7px);
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .bg-text {
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            font-weight: bold;
            border: 3px solid #f1f1f1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 80%;
            padding: 40px;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: white;
            margin: 20px;

        }


    </style>
</head>
<body>
<div class="bg-image"></div>

<div class="bg-text">
    <h1> {{ background_path }}</h1>
    <h1>{{ app_name }}</h1>
    <p>Zapoznaj się z Wydziałem!</p>
    <a href="/login"><b>Zaloguj się</b></a>
</div>

</body>
</html>
